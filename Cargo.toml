[package]
name = "sgm-scaffold"
version = "0.1.0"
edition = "2024"
description = "SGM Studios project scaffolding CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SGM-Studios/sgm-scaffold"

[[bin]]
name = "sgm-scaffold"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "suggestions"] }
minijinja = "2"
rust-embed = { version = "8", features = ["compression"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
